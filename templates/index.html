<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>PingMonitor</title>

<style>

body{
font-family:Arial;
margin:30px;
background:#f5f5f5;
}


.box{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
}


input{
padding:8px;
margin:5px;
}


button{
padding:8px 15px;
cursor:pointer;
}


table{
width:100%;
border-collapse:collapse;
}


td,th{
border-bottom:1px solid #ddd;
padding:10px;
}


.online{
color:green;
font-weight:bold;
}


.offline{
color:red;
font-weight:bold;
}


#logs{
height:300px;
overflow:auto;
background:#111;
color:#0f0;
padding:10px;
font-family:monospace;
}

</style>

</head>


<body>


<h1>PingMonitor</h1>


<div class="box">


<h3>监控节点</h3>


<table>

<thead>

<tr>

<th>名称</th>
<th>IP</th>
<th>状态</th>
<th>延迟</th>
<th>失败次数</th>
<th>最后检测</th>
<th>操作</th>

</tr>

</thead>


<tbody id="nodes">

</tbody>


</table>



<h4>添加节点</h4>


<input id="name" placeholder="节点名称">

<input id="ip" placeholder="IP地址">


<button onclick="addNode()">
添加
</button>


</div>




<div class="box">

<h3>Telegram Worker</h3>

<input id="worker" style="width:400px">

<button onclick="saveWorker()">
保存
</button>

</div>




<div class="box">

<h3>检测间隔</h3>

<input id="interval" type="number">

秒

<button onclick="saveInterval()">
保存
</button>

</div>




<div class="box">

<h3>服务控制</h3>

<button onclick="service('start')">
开始监控
</button>

<button onclick="service('stop')">
停止监控
</button>

<button onclick="service('restart')">
重启监控
</button>


</div>




<div class="box">

<h3>实时日志</h3>

<div id="logs">
加载中...
</div>

</div>





<script>


async function loadConfig(){

let r=await fetch('/api/config');

let c=await r.json();


let html="";


c.nodes.forEach(n=>{


html+=`

<tr>

<td>${n.name}</td>

<td>${n.ip}</td>


<td>

${
n.status=="在线"

?

'<span class="online">🟢 在线</span>'

:

'<span class="offline">🔴 '+n.status+'</span>'

}

</td>


<td>${n.delay || "-"}</td>


<td>${n.fail || 0}</td>


<td>${n.last || "-"}</td>


<td>

<button onclick="delNode('${n.ip}')">

删除

</button>

</td>


</tr>

`;

});


document.getElementById(
"nodes"
).innerHTML=html;


document.getElementById(
"worker"
).value=c.worker || "";


document.getElementById(
"interval"
).value=c.interval || 60;


}



async function addNode(){

await fetch(
"/api/add",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

name:
document.getElementById("name").value,

ip:
document.getElementById("ip").value

})
});


loadConfig();

}



async function delNode(ip){

await fetch(
"/api/delete",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
ip:ip
})
});


loadConfig();

}



async function saveWorker(){

await fetch(
"/api/worker",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

worker:
document.getElementById("worker").value

})
});


alert("保存成功");

}



async function saveInterval(){

await fetch(
"/api/interval",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

interval:
document.getElementById("interval").value

})
});


alert("检测间隔已修改");

}




async function service(a){

await fetch(
"/api/service/"+a
);

}



async function loadLogs(){

let r=await fetch(
"/api/logs"
);


let logs=await r.json();


document.getElementById(
"logs"
).innerHTML=
logs.join("<br>");

}



loadConfig();

loadLogs();


setInterval(
loadLogs,
5000
);


setInterval(
loadConfig,
10000
);


</script>


</body>

</html>
