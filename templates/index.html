<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
PingMonitor
</title>


<meta http-equiv="refresh" content="10">


<style>

body{

background:#111827;

color:white;

font-family:
Arial,
Microsoft YaHei;

}


h1{

text-align:center;

}



.info{

text-align:center;

color:#aaa;

}



table{

width:90%;

margin:30px auto;

border-collapse:collapse;

background:#1f2937;

}



th{

background:#374151;

padding:14px;

}



td{

padding:14px;

text-align:center;

border-bottom:1px solid #4b5563;

}



.online{

color:#22c55e;

font-weight:bold;

}



.offline{

color:#ef4444;

font-weight:bold;

}



.circle{

display:inline-block;

width:10px;

height:10px;

border-radius:50%;

margin-right:6px;

}



.green{

background:#22c55e;

}



.red{

background:#ef4444;

}



</style>

</head>



<body>


<h1>
🚀 Ping Monitor 节点状态
</h1>


<div class="info">

更新时间：
{{update_time}}

</div>



<table>


<tr>

<th>
节点名称
</th>


<th>
IP地址
</th>


<th>
状态
</th>


<th>
延迟
</th>


<th>
失败次数
</th>


</tr>



{% for node in nodes %}


<tr>


<td>

{{node.name}}

</td>



<td>

{{node.ip}}

</td>



<td>


{% if node.online %}


<span class="circle green"></span>

<span class="online">
在线
</span>


{% else %}


<span class="circle red"></span>

<span class="offline">
离线
</span>


{% endif %}


</td>




<td>


{% if node.latency %}

{{node.latency}} ms


{% else %}

-

{% endif %}


</td>



<td>

{{node.fail_count}}

</td>


</tr>


{% endfor %}


</table>


</body>


</html>
