<style>
  /* 调整区块标题的上下间距，使其精准居于上下两卡片间隙的正中间 */
  .group-title { 
    font-size: 13px; 
    font-weight: 600; 
    color: var(--text-muted); 
    text-transform: uppercase; 
    letter-spacing: -0.1px; 
    margin: 20px 2px 14px; /* 上方 20px，下方 14px，实现视觉居中 */
  }
  
  /* 其余样式保持不变 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ios-bg: #f2f2f7; --card-bg: #ffffff; --text-main: #000000; --text-muted: #8e8e93;
    --ios-blue: #007aff; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500;
    --card-radius: 14px; --divider-color: rgba(60, 60, 67, 0.12);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background-color: var(--ios-bg) !important; color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body.drawer-open { overflow: hidden !important; position: fixed; width: 100%; }
  .main-wrapper { max-width: 1320px; margin: 0 auto; padding: 0 20px calc(80px + env(safe-area-inset-bottom)); background-color: var(--ios-bg); }
  .ios-large-header { padding-top: calc(env(safe-area-inset-top) + 20px); padding-bottom: 12px; }
  .large-title { font-size: 32px; font-weight: 800; letter-spacing: -0.6px; color: var(--text-main); line-height: 1.1; }
  .header-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--ios-green); display: inline-block; flex-shrink: 0; }
  .last-update-text { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  
  .widget-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .widget-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .widget-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: 90px; }
  .widget-lbl { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .widget-val { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; line-height: 1; }
  .ios-card { background: var(--card-bg); border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  #nodes-container { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; max-height: 480px; }
  #nodes-container::-webkit-scrollbar { display: none; }
  .terminal-body::-webkit-scrollbar, .drawer-content::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-thumb, .drawer-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .node-cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .node-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px; }
  .node-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .node-identity { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .node-name { font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-ip { font-size: 13px; color: var(--text-muted); font-family: SFMono-Regular, Monaco, Consolas, monospace; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; width: fit-content; }
  .node-ip:hover { color: var(--ios-blue); text-decoration: underline; }
  .node-bottom-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 0.5px solid var(--divider-color); }
  .node-stats-group { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }
  .stat-val { font-weight: 600; color: var(--text-main); }
  .node-action-group { display: flex; align-items: center; gap: 12px; }
  .badge-online { color: #248a3d; background: rgba(52,199,89,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-offline { color: var(--ios-red); background: rgba(255,59,48,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-checking { color: var(--ios-blue); background: rgba(0,122,255,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .delay-text { font-size: 15px; font-weight: 700; font-family: SFMono-Regular, Monaco, Consolas, monospace; }
  .delay-good { color: var(--ios-green); }
  .delay-medium { color: var(--ios-orange); }
  .delay-bad { color: var(--ios-red); }
  .del-btn { background: rgba(255,59,48,0.1); color: var(--ios-red); border: none; height: 30px; padding: 0 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  @media (min-width: 768px) {
    .node-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 26px; gap: 24px; }
    .node-top-row { flex: 1; border-top: none; padding-top: 0; }
    .node-bottom-row { border-top: none; padding-top: 0; gap: 28px; }
  }
  .input-group { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ios-input { width: 100%; height: 40px; background: #f2f2f7; border: none; border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--text-main); outline: none; }
  .ios-input:focus { background: #e5e5ea; }
  .ios-btn { height: 40px; border-radius: 8px; border: none; background: var(--ios-blue); color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ios-btn-secondary { background: #e5e5ea; color: var(--ios-blue); }
  .ios-btn-danger { background: rgba(255,59,48,0.12); color: var(--ios-red); }
  
  .terminal-card { background: #1c1c1e; border-radius: var(--card-radius); padding: 14px 18px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.03); height: 260px; flex-shrink: 0; }
  .terminal-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 0.5px solid rgba(255,255,255,0.12); flex-shrink: 0; }
  .terminal-title { font-size: 11px; color: #8e8e93; font-weight: 600; letter-spacing: 0.5px; font-family: SFMono-Regular, Consolas, Monaco, monospace; }
  .terminal-clear-btn { background: rgba(255,59,48,0.2); color: #ff453a; border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .terminal-body { flex: 1; overflow-y: auto; color: #34c759; font-family: SFMono-Regular, Consolas, Monaco, monospace; font-size: 12px; line-height: 1.6; word-break: break-all; }
  
  @media (max-width: 991px) {
    .dashboard-grid { display: flex; flex-direction: column; gap: 16px; }
    .main-section { display: flex; flex-direction: column; gap: 16px; }
    .drawer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: rgba(0,0,0,0.45); opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease; z-index: 900;
    }
    .drawer-overlay.open { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
    .bottom-drawer {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(100vh - env(safe-area-inset-top) - 10px); height: calc(100dvh - env(safe-area-inset-top) - 10px);
      max-height: 720px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.12); z-index: 1000;
      transform: translate3d(0, calc(100% - 64px), 0); will-change: transform;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
      touch-action: none;
    }
    .bottom-drawer.open { transform: translate3d(0, 0, 0) !important; }
    .bottom-drawer.closed { transform: translate3d(0, calc(100% - 64px), 0) !important; }
    .bottom-drawer.dragging { transition: none !important; }
    .drawer-header-area { flex-shrink: 0; cursor: grab; user-select: none; padding-bottom: 4px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px; }
    .drawer-header { height: 22px; display: flex; align-items: center; justify-content: center; }
    .drawer-pill { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3); }
    .drawer-title-bar { padding: 0 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-title { font-size: 16px; font-weight: 700; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  }
  @media (min-width: 992px) {
    .drawer-overlay { display: none !important; }
    .bottom-drawer { position: static !important; transform: none !important; background: transparent !important; box-shadow: none !important; height: auto !important; max-height: none !important; z-index: 1 !important; display: flex; flex-direction: column; }
    .drawer-header-area { display: none !important; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: stretch; margin-top: 10px; }
    .main-section { grid-column: 1; display: flex; flex-direction: column; }
    .logs-section-wrapper { display: flex; flex-direction: column; flex: 1; }
    .controls-sidebar { grid-column: 2; display: flex; flex-direction: column; height: 100%; }
    .drawer-content { flex: 1; display: flex; flex-direction: column; padding: 0 !important; overflow-y: visible !important; }
    .controls-sidebar > div:last-child { flex: 1; display: flex; flex-direction: column; }
    .controls-sidebar > div:last-child .ios-card { flex: 1; display: flex; flex-direction: column; }
    .main-section .group-title:first-child, .controls-sidebar .group-title:first-child { margin-top: 0; }
  }
  #toast {
    position: fixed; top: calc(env(safe-area-inset-top) + 20px); left: 50%;
    transform: translateX(-50%) translateY(-60px); background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff;
    padding: 10px 24px; border-radius: 25px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
