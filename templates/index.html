<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PingMonitor</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ios-bg: #f2f2f7; --card-bg: #ffffff; --text-main: #000000; --text-muted: #8e8e93;
    --ios-blue: #007aff; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500;
    --card-radius: 14px; --divider-color: rgba(60, 60, 67, 0.12);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background-color: var(--ios-bg) !important; color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body.drawer-open {
    overflow: hidden !important;
    position: fixed;
    width: 100%;
  }
  .main-wrapper { max-width: 1320px; margin: 0 auto; padding: 0 20px calc(80px + env(safe-area-inset-bottom)); background-color: var(--ios-bg); }
  .ios-large-header { padding-top: calc(env(safe-area-inset-top) + 20px); padding-bottom: 12px; }
  .large-title { font-size: 32px; font-weight: 800; letter-spacing: -0.6px; color: var(--text-main); line-height: 1.1; }
  .header-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--ios-green); display: inline-block; flex-shrink: 0; transition: background-color 0.3s ease; }
  .last-update-text { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  
  /* 基础区块标题：默认移动端间距 */
  .group-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: -0.1px; margin: 24px 2px 12px; }
  
  /* 针对你指定的三个标题：在移动端和桌面端都统一加大上方间距，使其完美下沉到两张卡片正中间 */
  .group-title.middle-title {
    margin-top: 36px !important;
    margin-bottom: 12px !important;
  }
  
  .widget-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .widget-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .widget-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: 90px; }
  .widget-lbl { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .widget-val { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; line-height: 1; }
  .ios-card { background: var(--card-bg); border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  #nodes-container { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; max-height: 480px; }
  #nodes-container::-webkit-scrollbar { display: none; }
  .terminal-body::-webkit-scrollbar, .drawer-content::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-thumb, .drawer-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .node-cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .node-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .node-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .node-identity { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .node-name { font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-ip { font-size: 13px; color: var(--text-muted); font-family: SFMono-Regular, Monaco, Consolas, monospace; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; width: fit-content; }
  .node-ip:hover { color: var(--ios-blue); text-decoration: underline; }
  .node-bottom-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 0.5px solid var(--divider-color); }
  .node-stats-group { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }
  .stat-val { font-weight: 600; color: var(--text-main); }
  .node-action-group { display: flex; align-items: center; gap: 12px; }
  .badge-online { color: #248a3d; background: rgba(52,199,89,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-offline { color: var(--ios-red); background: rgba(255,59,48,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-checking { color: var(--ios-blue); background: rgba(0,122,255,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .delay-text { font-size: 15px; font-weight: 700; font-family: SFMono-Regular, Monaco, Consolas, monospace; }
  .delay-good { color: var(--ios-green); }
  .delay-medium { color: var(--ios-orange); }
  .delay-bad { color: var(--ios-red); }
  .del-btn { background: rgba(255,59,48,0.1); color: var(--ios-red); border: none; height: 30px; padding: 0 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
  .del-btn:hover { background: rgba(255,59,48,0.2); }
  @media (min-width: 768px) {
    .node-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 26px; gap: 24px; }
    .node-top-row { flex: 1; border-top: none; padding-top: 0; }
    .node-bottom-row { border-top: none; padding-top: 0; gap: 28px; }
  }
  .input-group { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ios-input { width: 100%; height: 40px; background: #f2f2f7; border: none; border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--text-main); outline: none; }
  .ios-input:focus { background: #e5e5ea; }
  .ios-btn { height: 40px; border-radius: 8px; border: none; background: var(--ios-blue); color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ios-btn-secondary { background: #e5e5ea; color: var(--ios-blue); }
  .ios-btn-danger { background: rgba(255,59,48,0.12); color: var(--ios-red); }
  
  .terminal-card { background: #1c1c1e; border-radius: var(--card-radius); padding: 14px 18px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.03); height: 260px; flex-shrink: 0; }
  .terminal-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 0.5px solid rgba(255,255,255,0.12); flex-shrink: 0; }
  .terminal-title { font-size: 11px; color: #8e8e93; font-weight: 600; letter-spacing: 0.5px; font-family: SFMono-Regular, Consolas, Monaco, monospace; }
  .terminal-clear-btn { background: rgba(255,59,48,0.2); color: #ff453a; border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .terminal-body { flex: 1; overflow-y: auto; color: #34c759; font-family: SFMono-Regular, Consolas, Monaco, monospace; font-size: 12px; line-height: 1.6; word-break: break-all; }
  
  @media (max-width: 991px) {
    .dashboard-grid { display: flex; flex-direction: column; gap: 16px; }
    .main-section { display: flex; flex-direction: column; gap: 16px; }
    .drawer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: rgba(0,0,0,0.45); opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease; z-index: 900;
    }
    .drawer-overlay.open { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
    .bottom-drawer {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(100vh - env(safe-area-inset-top) - 10px); height: calc(100dvh - env(safe-area-inset-top) - 10px);
      max-height: 720px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.12); z-index: 1000;
      transform: translate3d(0, calc(100% - 64px), 0); will-change: transform;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
      touch-action: none;
    }
    .bottom-drawer.open { transform: translate3d(0, 0, 0) !important; }
    .bottom-drawer.closed { transform: translate3d(0, calc(100% - 64px), 0) !important; }
    .bottom-drawer.dragging { transition: none !important; }
    .drawer-header-area { flex-shrink: 0; cursor: grab; user-select: none; padding-bottom: 4px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px; }
    .drawer-header { height: 22px; display: flex; align-items: center; justify-content: center; }
    .drawer-pill { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3); }
    .drawer-title-bar { padding: 0 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-title { font-size: 16px; font-weight: 700; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  }
  @media (min-width: 992px) {
    .drawer-overlay { display: none !important; }
    .bottom-drawer { position: static !important; transform: none !important; background: transparent !important; box-shadow: none !important; height: auto !important; max-height: none !important; z-index: 1 !important; display: flex; flex-direction: column; }
    .drawer-header-area { display: none !important; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: stretch; margin-top: 10px; }
    .main-section { grid-column: 1; display: flex; flex-direction: column; }
    .logs-section-wrapper { display: flex; flex-direction: column; flex: 1; }
    .controls-sidebar { grid-column: 2; display: flex; flex-direction: column; height: 100%; }
    .drawer-content { flex: 1; display: flex; flex-direction: column; padding: 0 !important; overflow-y: visible !important; }
    .controls-sidebar > div:last-child { flex: 1; display: flex; flex-direction: column; }
    .controls-sidebar > div:last-child .ios-card { flex: 1; display: flex; flex-direction: column; }
    .main-section .group-title:first-child, .controls-sidebar .group-title:first-child { margin-top: 0; }
  }
  #toast {
    position: fixed; top: calc(env(safe-area-inset-top) + 20px); left: 50%;
    transform: translateX(-50%) translateY(-60px); background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff;
    padding: 10px 24px; border-radius: 25px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="main-wrapper" id="main-content">
  <div class="ios-large-header">
    <div class="large-title">PingMonitor</div>
    <div class="header-sub-row">
      <span class="status-dot" id="header-dot"></span>
      <span class="last-update-text" id="last-update">最后更新: --:--:--</span>
    </div>
  </div>

  <div class="group-title">系统状态概览</div>
  <div class="widget-grid">
    <div class="widget-card"><div class="widget-lbl">总监控节点</div><div class="widget-val" id="stat-total">0</div></div>
    <div class="widget-card"><div class="widget-lbl">在线节点</div><div class="widget-val" style="color: var(--ios-green);" id="stat-online">0</div></div>
    <div class="widget-card"><div class="widget-lbl">异常节点</div><div class="widget-val" style="color: var(--ios-red);" id="stat-offline">0</div></div>
    <div class="widget-card"><div class="widget-lbl">平均延迟</div><div class="widget-val" style="color: var(--ios-blue);" id="stat-delay">-- ms</div></div>
  </div>

  <div class="dashboard-grid">
    <div class="main-section">
      <div class="group-title">监控节点列表</div>
      <div id="nodes-container">
        <div class="ios-card" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px;">正在加载节点...</div>
      </div>

      <div class="logs-section-wrapper">
        <div class="group-title middle-title">实时系统日志</div>
        <div class="terminal-card">
          <div class="terminal-header">
            <span class="terminal-title">CONSOLE LOGS</span>
            <button class="terminal-clear-btn" onclick="clearLogs()">清空日志</button>
          </div>
          <div class="terminal-body" id="logs">加载日志中...</div>
        </div>
      </div>
    </div>

    <div class="bottom-drawer" id="drawer">
      <div class="drawer-header-area" id="drawer-header-area" onclick="toggleDrawer()">
        <div class="drawer-header"><div class="drawer-pill"></div></div>
        <div class="drawer-title-bar"><div class="drawer-title">控制台与管理设置</div></div>
      </div>
      
      <div class="drawer-content" id="drawer-content">
        <div class="controls-sidebar">
          <div>
            <div class="group-title">添加新监控节点</div>
            <div class="ios-card">
              <div class="input-group">
                <input class="ios-input" id="name" placeholder="节点名称（例如: 香港服务器）">
                <input class="ios-input" id="ip" placeholder="IP 地址或域名">
                <button class="ios-btn" onclick="addNode()">添加节点</button>
              </div>
            </div>
          </div>

          <div>
            <div class="group-title middle-title">推送与检测配置</div>
            <div class="ios-card">
              <div class="input-group">
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px;">Telegram Worker</div>
                  <div style="display: flex; gap: 8px;">
                    <input class="ios-input" id="worker" placeholder="https://your-worker.workers.dev">
                    <button class="ios-btn ios-btn-secondary" style="width: 80px; flex-shrink: 0;" onclick="saveWorker()">保存</button>
                  </div>
                </div>
                <div style="height: 0.5px; background: var(--divider-color);"></div>
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px;">检测频率 (秒)</div>
                  <div style="display: flex; gap: 8px;">
                    <input class="ios-input" id="interval" type="number" min="5" placeholder="60">
                    <button class="ios-btn ios-btn-secondary" style="width: 80px; flex-shrink: 0;" onclick="saveInterval()">保存</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="group-title middle-title">服务控制</div>
            <div class="ios-card" style="display: flex; flex-direction: column; justify-content: space-between;">
              <div style="padding: 16px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                  <div style="font-size: 14px; font-weight: 600;">后台运行状态</div>
                  <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">运行时间: <span id="service-uptime" style="font-family: monospace; font-weight: 600;">--:--:--</span></div>
                </div>
                <span class="badge-online" id="service-status-badge">检测中</span>
              </div>
              <div style="height: 0.5px; background: var(--divider-color);"></div>
              <div style="padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto;">
                <button class="ios-btn" style="height: 40px; font-size: 13px;" onclick="service('start')">启动</button>
                <button class="ios-btn ios-btn-danger" style="height: 40px; font-size: 13px;" onclick="service('stop')">停止</button>
                <button class="ios-btn ios-btn-secondary" style="height: 40px; font-size: 13px;" onclick="service('restart')">重启</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
<div id="toast">提示信息</div>

<script>
const USE_MOCK = false;
let lastRenderedHTML = "", lastLogsText = "";
const $ = id => document.getElementById(id);

function formatUptime(s) {
    if (s < 0) s = 0;
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (d > 0 ? d + "天 " : "") + [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
}

function showToast(msg) {
    const t = $("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}

function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(`已复制: ${text}`)).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast(`已复制: ${text}`); } catch { showToast("复制失败"); }
    document.body.removeChild(ta);
}

async function fetchJSON(url) {
    try { const res = await fetch(url); return res.ok ? await res.json() : null; } catch { return null; }
}

async function refreshDashboard(isInitial = false) {
    const [config, status, sysData, logsData] = await Promise.all([
        fetchJSON("/api/config"), fetchJSON("/api/status"), fetchJSON("/api/system"), fetchJSON("/api/logs")
    ]);

    if (sysData) {
        const badge = $("service-status-badge"), uptimeEl = $("service-uptime"), dot = $("header-dot");
        if (sysData.running) {
            badge.className = "badge-online"; badge.innerText = "运行中";
            uptimeEl.style.color = "var(--text-main)"; uptimeEl.innerText = formatUptime(sysData.uptime);
            if (dot) dot.style.backgroundColor = "var(--ios-green)";
        } else {
            badge.className = "badge-offline"; badge.innerText = "已停止";
            uptimeEl.innerText = "已停止"; uptimeEl.style.color = "var(--text-muted)";
            if (dot) dot.style.backgroundColor = "var(--ios-red)";
        }
    }

    if (config) {
        const wIn = $("worker"), iIn = $("interval");
        if (isInitial || document.activeElement !== wIn) wIn.value = config.worker || "";
        if (isInitial || document.activeElement !== iIn) iIn.value = config.interval || 60;
        
        const isRunning = sysData && sysData.running;
        const statusMap = {};
        (status || []).forEach(n => statusMap[n.ip] = n);

        let totalOnline = 0, totalOffline = 0, totalDelay = 0, delayCount = 0;
        const nodes = config.nodes || [];
        
        const htmlParts = nodes.map(n => {
            const item = !isRunning ? { name: n.name, ip: n.ip, status: "等待检测", delay: "-", last: "-", fail: 0 }
                       : (statusMap[n.ip] ? { ...statusMap[n.ip] } : { name: n.name, ip: n.ip, status: "检测中", delay: "-", last: "-", fail: 0 });

            if (item.status === "在线") totalOnline++;
            if (item.status === "离线") totalOffline++;
            const numDelay = parseInt(item.delay);
            if (!isNaN(numDelay)) { totalDelay += numDelay; delayCount++; }

            const badgeCls = item.status === "在线" ? "badge-online" : (item.status === "离线" ? "badge-offline" : "badge-checking");
            const delayCls = !isNaN(numDelay) ? (numDelay < 150 ? 'delay-good' : (numDelay < 400 ? 'delay-medium' : 'delay-bad')) : "";
            const failCount = parseInt(item.fail) || 0;

            return `
            <div class="node-card">
              <div class="node-top-row">
                <div class="node-identity">
                  <span class="node-name" title="${escapeHtml(item.name || '未命名')}">${escapeHtml(item.name || '未命名')}</span>
                  <span class="node-ip" onclick="copyText('${escapeHtml(item.ip)}')">${escapeHtml(item.ip)}</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                  <span class="${badgeCls}">${escapeHtml(item.status)}</span>
                  <span class="delay-text ${delayCls}">${escapeHtml(String(item.delay))}</span>
                </div>
              </div>
              <div class="node-bottom-row">
                <div class="node-stats-group">
                  <span>最后检测: <strong class="stat-val">${escapeHtml(String(item.last))}</strong></span>
                  ${failCount > 0 ? `<span style="color:var(--ios-red);">连续失败: <strong style="color:var(--ios-red);">${failCount} 次</strong></span>` : ''}
                </div>
                <div class="node-action-group">
                  <button class="del-btn" onclick="delNode('${escapeHtml(item.ip)}')">删除</button>
                </div>
              </div>
            </div>`;
        });

        $("stat-total").innerText = nodes.length;
        $("stat-online").innerText = totalOnline;
        $("stat-offline").innerText = totalOffline;
        $("stat-delay").innerText = delayCount > 0 ? Math.round(totalDelay / delayCount) + " ms" : "-- ms";
        $("last-update").innerText = "最后更新: " + new Date().toLocaleTimeString('zh-CN', { hour12: false });

        const container = $("nodes-container");
        if (nodes.length === 0) {
            container.innerHTML = '<div class="ios-card" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px;">暂无监控节点，请在右侧添加</div>';
            lastRenderedHTML = "";
        } else {
            const finalHTML = '<div class="node-cards-grid">' + htmlParts.join('') + '</div>';
            if (finalHTML !== lastRenderedHTML) {
                container.innerHTML = finalHTML;
                lastRenderedHTML = finalHTML;
            }
        }
    }

    if (logsData) {
        const box = $("logs");
        const logsStr = (logsData || []).join("\n");
        if (logsStr !== lastLogsText) {
            lastLogsText = logsStr;
            if (!logsData || logsData.length === 0) {
                box.innerHTML = "暂无日志或日志已被清空。";
            } else {
                box.innerHTML = logsData.map(line => escapeHtml(line)).join("<br>");
                box.scrollTop = box.scrollHeight;
            }
        }
    }
}

async function apiPost(url, data, successMsg) {
    try {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && (json.ok !== false)) {
            if (successMsg) showToast(successMsg);
            await refreshDashboard();
            return json;
        } else {
            showToast(json.error || "操作失败");
            return null;
        }
    } catch {
        showToast("网络请求失败");
        return null;
    }
}

async function addNode(){
    const name = $("name").value.trim(), ip = $("ip").value.trim();
    if (!ip) { showToast("请输入有效的 IP 地址或域名"); return; }
    if (await apiPost("/api/add", { name, ip }, "节点添加成功")) {
        $("name").value = ""; $("ip").value = "";
    }
}

async function delNode(ip){
    if (confirm(`确定要删除节点 [${ip}] 吗？`)) {
        await apiPost("/api/delete", { ip }, "节点已删除");
    }
}

async function saveWorker(){
    await apiPost("/api/worker", { worker: $("worker").value.trim() }, "Telegram Worker 已保存");
}

async function saveInterval(){
    const interval = $("interval").value;
    if (!interval || interval < 5) { showToast("间隔时间不能小于 5 秒"); return; }
    await apiPost("/api/interval", { interval }, "检测间隔已更新");
}

async function service(a){
    const actionMap = { start: '启动', stop: '停止', restart: '重启' };
    try {
        const res = await fetch("/api/service/" + a);
        const json = await res.json();
        if (json.ok) {
            showToast(`服务${actionMap[a] || a}指令已发送`);
            setTimeout(refreshDashboard, 500);
        } else {
            showToast(`指令发送失败: ${json.error || '未知错误'}`);
        }
    } catch {
        showToast("指令发送失败");
    }
}

async function clearLogs(){
    if (!confirm("确定要清空系统终端日志吗？")) return;
    try {
        const res = await fetch("/api/logs/clear", { method: "POST" });
        const json = await res.json();
        if (json.ok) {
            lastLogsText = "";
            await refreshDashboard();
            showToast("系统终端日志已清空");
        } else {
            showToast(`清空日志失败: ${json.error || '未知错误'}`);
        }
    } catch {
        showToast("清空日志失败");
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

const drawer = $("drawer"), overlay = $("drawer-overlay"), headerArea = $("drawer-header-area"), drawerContent = $("drawer-content");
let isExpanded = false, startY = 0, currentY = 0, isDragging = false, isPullFromContent = false, maxTranslate = 0, rafId = null;

function isMobile() { return window.innerWidth < 992; }

function toggleDrawer(expand, fromPopState = false) {
    if (!isMobile()) return;
    isExpanded = expand !== undefined ? expand : !isExpanded;
    drawer.style.transform = ""; overlay.style.opacity = ""; drawer.classList.remove("dragging");
    
    if (isExpanded) {
        drawer.classList.add("open"); drawer.classList.remove("closed"); overlay.classList.add("open");
        document.body.classList.add("drawer-open");
        if (!fromPopState) {
            try { history.pushState({ drawerOpen: true }, ""); } catch(e) {}
        }
    } else {
        drawer.classList.add("closed"); drawer.classList.remove("open"); overlay.classList.remove("open");
        document.body.classList.remove("drawer-open");
        if (!fromPopState && history.state && history.state.drawerOpen) {
            try { history.back(); } catch(e) {}
        }
    }
}

window.addEventListener("popstate", (e) => {
    if (isMobile() && isExpanded) {
        toggleDrawer(false, true);
    }
});

function onTouchStart(e, fromContent = false) {
    if (!isMobile()) return;
    if (fromContent && (drawerContent.scrollTop > 0 || !isExpanded)) return;
    startY = e.touches[0].clientY; currentY = startY; isDragging = true; isPullFromContent = fromContent;
    maxTranslate = drawer.offsetHeight - 64; drawer.classList.add("dragging");
}

function onTouchMove(e) {
    if (!isDragging || !isMobile()) return;
    currentY = e.touches[0].clientY;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
        const deltaY = currentY - startY;
        let currentTranslate = 0;
        if (isPullFromContent) {
            if (deltaY > 0 && drawerContent.scrollTop <= 0) {
                if (e.cancelable) e.preventDefault();
                currentTranslate = deltaY;
            } else { isDragging = false; return; }
        } else {
            if (e.cancelable) e.preventDefault();
            currentTranslate = !isExpanded ? Math.max(0, maxTranslate + deltaY) : Math.max(0, deltaY);
        }
        drawer.style.transform = `translate3d(0, ${currentTranslate}px, 0)`;
        const progress = Math.max(0, Math.min(1, 1 - (currentTranslate / maxTranslate)));
        overlay.style.opacity = progress;
        if (progress > 0) overlay.classList.add("open");
    });
}

function onTouchEnd() {
    if (!isDragging || !isMobile()) return;
    isDragging = false;
    if (rafId) cancelAnimationFrame(rafId);
    const deltaY = currentY - startY;
    toggleDrawer(!isExpanded ? deltaY < -40 : deltaY <= 50);
    startY = 0; currentY = 0; isPullFromContent = false;
}

headerArea.addEventListener("touchstart", e => onTouchStart(e, false), { passive: true });
headerArea.addEventListener("touchmove", onTouchMove, { passive: false });
headerArea.addEventListener("touchend", onTouchEnd);

drawerContent.addEventListener("touchstart", e => onTouchStart(e, true), { passive: true });
drawerContent.addEventListener("touchmove", onTouchMove, { passive: false });
drawerContent.addEventListener("touchend", onTouchEnd);

window.addEventListener('resize', () => {
    drawer.style.transform = ""; overlay.style.opacity = ""; drawer.classList.remove("dragging");
    if (!isMobile()) {
        drawer.classList.remove("open", "closed"); overlay.classList.remove("open");
        document.body.classList.remove("drawer-open");
    } else {
        drawer.classList.toggle("open", isExpanded); drawer.classList.toggle("closed", !isExpanded); overlay.classList.toggle("open", isExpanded);
        if (isExpanded) document.body.classList.add("drawer-open");
    }
});

refreshDashboard(true);
let pollTimer = setInterval(refreshDashboard, 5000);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearInterval(pollTimer); pollTimer = null; }
    else { refreshDashboard(); if (!pollTimer) pollTimer = setInterval(refreshDashboard, 5000); }
});
</script>
