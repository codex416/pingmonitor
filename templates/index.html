<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PingMonitor</title>

<style>
*{box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
background:#f5f8ff;
margin:0;
color:#1f2937;
}
h1{
margin:0;
padding:22px 30px;
font-size:28px;
color:#1769ff;
background:linear-gradient(135deg,#eef5ff,#dceaff);
border-bottom:1px solid #dbe7ff;
}
.box{
background:#fff;
margin:25px 30px;
padding:22px;
border-radius:14px;
border:1px solid #e5edff;
box-shadow:0 8px 25px rgba(30,90,180,.08);
}
.box h3{
margin-top:0;
color:#1264e8;
font-size:18px;
}
table{
width:100%;
border-collapse:collapse;
}
th{
background:#f6f9ff;
color:#52627a;
}
th,td{
padding:13px 10px;
border-bottom:1px solid #edf1f7;
text-align:center;
}
.online{color:#16a34a;font-weight:bold}
.offline{color:#ef4444;font-weight:bold}
.checking{color:#2563eb;font-weight:bold}
input{
height:40px;
padding:0 14px;
margin:5px;
border-radius:8px;
border:1px solid #d8e2f2;
}
button{
height:40px;
padding:0 22px;
border-radius:8px;
border:0;
cursor:pointer;
background:linear-gradient(135deg,#2878ff,#1760df);
color:#fff;
}
button[onclick^="delNode"]{
background:#fff;
color:#ef4444;
border:1px solid #fecaca;
}
button[onclick="service('stop')"]{
background:#ef4444;
}
button[onclick="service('restart')"]{
background:#fff;
color:#1769ff;
border:1px solid #9dc3ff;
}
#logs{
background:#111827;
color:#22c55e;
height:300px;
overflow:auto;
padding:15px;
border-radius:10px;
font-family:Consolas,monospace;
}

@media(max-width:768px){
h1{
padding:18px;
font-size:22px;
}
.box{
margin:15px;
padding:16px;
}
table{
display:block;
overflow-x:auto;
white-space:nowrap;
}
input{
width:100%;
margin:6px 0;
}
button{
width:100%;
margin-top:8px;
}
#logs{
height:240px;
}
}
</style>
</head>

<body>

<h1>PingMonitor</h1>

<div class="box">
<h3>监控节点</h3>

<table>
<thead>
<tr>
<th>名称</th>
<th>IP</th>
<th>状态</th>
<th>延迟</th>
<th>最后检测</th>
<th>失败次数</th>
<th>操作</th>
</tr>
</thead>

<tbody id="nodes"></tbody>
</table>

<h4>添加节点</h4>
<input id="name" placeholder="节点名称">
<input id="ip" placeholder="IP地址">
<button onclick="addNode()">添加</button>
</div>


<div class="box">
<h3>Telegram Worker</h3>
<input id="worker" style="width:400px">
<button onclick="saveWorker()">保存</button>
</div>


<div class="box">
<h3>检测间隔</h3>
<input id="interval" type="number">
秒
<button onclick="saveInterval()">保存</button>
</div>


<div class="box">
<h3>服务控制</h3>
<button onclick="service('start')">启动</button>
<button onclick="service('stop')">停止</button>
<button onclick="service('restart')">重启</button>
</div>


<div class="box">
<h3>实时日志</h3>
<div id="logs">加载中...</div>
</div>


<script>
async function loadConfig(){
    let r = await fetch("/api/config");
    let c = await r.json();

    document.getElementById("worker").value = c.worker || "";
    document.getElementById("interval").value = c.interval || 60;

    return c;
}

async function loadStatus(){
    let config = await loadConfig();
    let r = await fetch("/api/status");
    let status = await r.json();

    let map={};
    status.forEach(n=>{
        map[n.ip]=n;
    });

    let data=[];
    config.nodes.forEach(n=>{
        if(map[n.ip]){
            data.push(map[n.ip]);
        }else{
            data.push({
                name:n.name,
                ip:n.ip,
                status:"检测中",
                delay:"-",
                last:"-",
                fail:0
            });
        }
    });

    let html="";
    data.forEach(n=>{
        let cls="checking";
        if(n.status=="在线"){
            cls="online";
        }
        if(n.status=="离线"){
            cls="offline";
        }

        html += `
        <tr>
            <td>${n.name}</td>
            <td>${n.ip}</td>
            <td class="${cls}">${n.status}</td>
            <td>${n.delay}</td>
            <td>${n.last}</td>
            <td>${n.fail}</td>
            <td>
                <button onclick="delNode('${n.ip}')">删除</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("nodes").innerHTML = html;
}

async function addNode(){
    let name = document.getElementById("name").value;
    let ip = document.getElementById("ip").value;

    if(!ip){
        alert("请输入IP");
        return;
    }

    await fetch("/api/add",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name:name,
            ip:ip
        })
    });

    document.getElementById("name").value="";
    document.getElementById("ip").value="";

    loadStatus();
}

async function delNode(ip){
    await fetch("/api/delete",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            ip:ip
        })
    });

    setTimeout(loadStatus,500);
}

async function saveWorker(){
    await fetch("/api/worker",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            worker: document.getElementById("worker").value
        })
    });

    alert("保存成功");
}

async function saveInterval(){
    await fetch("/api/interval",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            interval: document.getElementById("interval").value
        })
    });

    alert("检测间隔已修改");
}

async function service(a){
    await fetch("/api/service/"+a);
    alert("执行完成");
}

async function loadLogs(){
    let r = await fetch("/api/logs");
    let data = await r.json();

    let box = document.getElementById("logs");
    box.innerHTML = data.join("<br>");
    box.scrollTop = box.scrollHeight;
}

loadStatus();
loadLogs();

setInterval(loadStatus,5000);
setInterval(loadLogs,5000);
</script>

</body>
</html>
