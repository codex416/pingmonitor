<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PingMonitor</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ios-bg: #f2f2f7; --card-bg: #ffffff; --text-main: #000000; --text-muted: #8e8e93;
    --ios-blue: #007aff; --ios-green: #34c759; --ios-red: #ff3b30; --ios-orange: #ff9500;
    --card-radius: 14px; --divider-color: rgba(60, 60, 67, 0.12);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background-color: var(--ios-bg) !important; color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body.drawer-open {
    overflow: hidden !important;
    position: fixed;
    width: 100%;
  }
  .main-wrapper { max-width: 1320px; margin: 0 auto; padding: 0 20px calc(80px + env(safe-area-inset-bottom)); background-color: var(--ios-bg); }
  .ios-large-header { padding-top: calc(env(safe-area-inset-top) + 20px); padding-bottom: 12px; cursor: pointer; user-select: none; }
  .large-title { font-size: 32px; font-weight: 800; letter-spacing: -0.6px; color: var(--text-main); line-height: 1.1; }
  .header-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--ios-green); display: inline-block; flex-shrink: 0; transition: background-color 0.3s ease; }
  .last-update-text { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .desktop-control-btn { display: none; }
  
  /* 基础区块标题 */
  .group-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: -0.1px; margin: 24px 2px 12px; }
  .group-title.middle-title { margin-top: 36px !important; margin-bottom: 12px !important; }
  
  .widget-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 768px) { .widget-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  @media (min-width: 992px) {
    .node-cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  }
  .widget-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; height: 90px; }
  .widget-lbl { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .widget-val { font-size: 28px; font-weight: 700; letter-spacing: -0.8px; line-height: 1; }
  .ios-card { background: var(--card-bg); border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  #nodes-container { overflow: visible; max-height: none; }
  #nodes-container::-webkit-scrollbar { display: none; }
  .terminal-body::-webkit-scrollbar, .drawer-content::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-thumb, .drawer-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .node-cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .node-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .node-top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .node-identity { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .node-name { font-size: 17px; font-weight: 700; line-height: 1.25; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-ip { font-size: 13px; color: var(--text-muted); font-family: SFMono-Regular, Monaco, Consolas, monospace; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; width: fit-content; }
  .node-ip:hover { color: var(--ios-blue); text-decoration: underline; }
  .node-device-icons { font-size: 13px; color: var(--text-muted); margin-left: 4px; }
  .node-device-icons span { margin-right: 4px; }
  .node-location { font-size: 12px; color: var(--text-muted); line-height: 1.3; }

  .node-bottom-row { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 0.5px solid var(--divider-color); }
  .node-stats-group { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }
  .stat-val { font-weight: 600; color: var(--text-main); }
  .node-action-group { display: flex; align-items: center; gap: 12px; }
  .badge-online { color: #248a3d; background: rgba(52,199,89,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-offline { color: var(--ios-red); background: rgba(255,59,48,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-checking { color: var(--ios-blue); background: rgba(0,122,255,0.15); padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .delay-text { font-size: 15px; font-weight: 700; font-family: SFMono-Regular, Monaco, Consolas, monospace; }
  .delay-good { color: var(--ios-green); }
  .delay-medium { color: var(--ios-orange); }
  .delay-bad { color: var(--ios-red); }
  .del-btn { background: rgba(255,59,48,0.1); color: var(--ios-red); border: none; height: 30px; padding: 0 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
  .del-btn:hover { background: rgba(255,59,48,0.2); }

  .empty-pc { display: none; }
  .empty-mobile { display: inline; }
  @media (min-width: 992px) {
    .empty-pc { display: inline; }
    .empty-mobile { display: none; }
    .node-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 16px 20px; height: 90px; gap: 24px; }
    .node-top-row { flex: 1; border-top: none; padding-top: 0; }
    .node-bottom-row { border-top: none; padding-top: 0; gap: 28px; }
  }

  .input-group { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .ios-input { width: 100%; height: 40px; background: #f2f2f7; border: none; border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--text-main); outline: none; }
  .ios-input:focus { background: #e5e5ea; }
  .ios-btn { height: 40px; border-radius: 8px; border: none; background: var(--ios-blue); color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ios-btn-secondary { background: #e5e5ea; color: var(--ios-blue); }
  .ios-btn-danger { background: rgba(255,59,48,0.12); color: var(--ios-red); }
  
  .terminal-card { background: #1c1c1e; border-radius: var(--card-radius); padding: 14px 18px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.03); height: 260px; flex-shrink: 0; }
  .terminal-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 0.5px solid rgba(255,255,255,0.12); flex-shrink: 0; }
  .terminal-title { font-size: 11px; color: #8e8e93; font-weight: 600; letter-spacing: 0.5px; font-family: SFMono-Regular, Consolas, Monaco, monospace; }
  .terminal-clear-btn { background: rgba(255,59,48,0.2); color: #ff453a; border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .terminal-body { flex: 1; overflow-y: auto; color: #34c759; font-family: SFMono-Regular, Consolas, Monaco, monospace; font-size: 12px; line-height: 1.6; word-break: break-all; }
  
  @media (max-width: 991px) {
    .dashboard-grid { display: flex; flex-direction: column; gap: 16px; }
    .main-section { display: flex; flex-direction: column; gap: 16px; }
    .drawer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: rgba(0,0,0,0.45); opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease; z-index: 900;
    }
    .drawer-overlay.open { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
    
    .bottom-drawer {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(100vh - env(safe-area-inset-top) - 10px); height: calc(100dvh - env(safe-area-inset-top) - 10px);
      max-height: 720px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.12); z-index: 1000;
      transform: translate3d(0, 100%, 0);
      visibility: hidden;
      pointer-events: none;
      will-change: transform;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s;
      display: flex; flex-direction: column;
      touch-action: none;
    }
    .bottom-drawer.open {
      transform: translate3d(0, 0, 0) !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }
    .bottom-drawer.closed {
      transform: translate3d(0, 100%, 0) !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .bottom-drawer.dragging { transition: none !important; }
    .drawer-header-area { flex-shrink: 0; cursor: grab; user-select: none; padding-bottom: 4px; background: #f2f2f7; border-top-left-radius: 20px; border-top-right-radius: 20px; }
    .drawer-header { height: 22px; display: flex; align-items: center; justify-content: center; }
    .drawer-pill { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3); }
    .drawer-title-bar { padding: 0 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-title { font-size: 16px; font-weight: 700; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  }
  @media (min-width: 992px) {
    .desktop-control-btn {
      display: flex;
      position: absolute;
      top: 24px;
      right: 20px;
      height: 38px;
      padding: 0 16px;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      background: var(--ios-blue);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      z-index: 5;
    }
    .main-wrapper { position: relative; }

    .drawer-overlay {
      display: none !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(0,0,0,0.35) !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      z-index: 1900 !important;
    }
    .drawer-overlay.open {
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    .bottom-drawer {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      bottom: auto !important;
      width: min(720px, calc(100vw - 48px)) !important;
      height: min(780px, calc(100vh - 48px)) !important;
      max-height: none !important;
      transform: translate(-50%, -50%) scale(0.96) !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      background: #f2f2f7 !important;
      border-radius: 18px !important;
      box-shadow: 0 18px 55px rgba(0,0,0,0.22) !important;
      z-index: 2000 !important;
      display: flex !important;
      flex-direction: column !important;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease !important;
      overflow: hidden !important;
    }
    .bottom-drawer.open {
      transform: translate(-50%, -50%) scale(1) !important;
      visibility: visible !important;
      pointer-events: auto !important;
      opacity: 1 !important;
    }
    .bottom-drawer.closed {
      transform: translate(-50%, -50%) scale(0.96) !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
    .drawer-header-area {
      display: block !important;
      flex-shrink: 0;
      cursor: default !important;
      padding-bottom: 4px;
      background: #f2f2f7;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
    }
    .drawer-header { height: 22px; }
    .drawer-title-bar { padding: 4px 20px 14px; }
    .drawer-close-btn {
      display: flex !important;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: #e5e5ea;
      color: var(--text-main);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .drawer-content {
      flex: 1 !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom)) !important;
      overflow-y: auto !important;
    }
    .controls-sidebar { display: flex; flex-direction: column; }
    .logs-section-wrapper { display: flex; flex-direction: column; }
    .dashboard-grid { display: block; margin-top: 10px; }
    .main-section { display: flex; flex-direction: column; }
    .main-section .group-title:first-child { margin-top: 0; }
    .controls-sidebar .group-title:first-child { margin-top: 0; }
    .terminal-card { height: 260px; }
  }
  .node-list-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 36px;
  }
  .node-list-header .group-title { margin-right: 0; }

  .node-sort-btn {
    height: 32px;
    min-width: 58px;
    padding: 0 13px;
    border: 0.5px solid rgba(0,122,255,0.18);
    border-radius: 9px;
    background: rgba(0,122,255,0.08);
    color: var(--ios-blue);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease;
  }
  .node-sort-btn:hover { background: rgba(0,122,255,0.13); }
  .node-sort-btn:active { transform: scale(.96); }
  .node-sort-btn.active {
    background: var(--ios-blue);
    border-color: var(--ios-blue);
    color: #fff;
  }

  .sort-hint {
    display: none;
    align-items: center;
    gap: 7px;
    margin: -2px 2px 10px;
    font-size: 11px;
    color: var(--text-muted);
    animation: sortHintIn .22s ease both;
  }
  .sort-hint.show { display: flex; }
  .sort-hint-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ios-blue);
    box-shadow: 0 0 0 4px rgba(0,122,255,.08);
    flex: 0 0 auto;
  }
  @keyframes sortHintIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .node-card { position: relative; }

  /* 三横手柄：精致、紧凑，不占用卡片布局空间 */
  .node-sort-handle {
    display: none;
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 42px;
    padding: 0;
    border: 0.5px solid rgba(60,60,67,0.10);
    border-radius: 10px;
    background: rgba(242,242,247,0.94);
    color: #8e8e93;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
    z-index: 5;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .node-sort-handle span {
    display: block;
    width: 15px;
    height: 2px;
    border-radius: 3px;
    background: currentColor;
  }
  .node-sort-handle:hover {
    color: var(--ios-blue);
    background: rgba(0,122,255,.08);
    box-shadow: 0 3px 10px rgba(0,122,255,.10);
  }
  .node-sort-handle.grabbing,
  .node-sort-handle:active {
    cursor: grabbing;
    color: var(--ios-blue);
    background: rgba(0,122,255,.12);
    transform: translateY(-50%) scale(1.04);
  }

  /* 排序模式视觉反馈：卡片不改变尺寸、不增加 padding */
  .node-cards-grid.sorting .node-sort-handle { display: flex; }
  .node-cards-grid.sorting .node-card {
    outline: 1px solid rgba(0,122,255,.08);
    box-shadow: 0 3px 12px rgba(0,0,0,.045);
  }
  .node-cards-grid.sorting .node-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(0,122,255,.12);
    border-radius: var(--card-radius);
    pointer-events: none;
  }
  .node-card.dragging {
    opacity: .96;
    transform: scale(1.018);
    box-shadow: 0 14px 32px rgba(0,0,0,.16);
    outline: 1.5px solid rgba(0,122,255,.30) !important;
    z-index: 20;
    transition: none !important;
  }
  .node-card.dragging .node-sort-handle {
    color: var(--ios-blue);
    background: rgba(0,122,255,.12);
    box-shadow: 0 4px 12px rgba(0,122,255,.12);
  }

  @media (max-width: 991px) {
    .node-list-header { gap: 8px; }
    .node-sort-btn {
      height: 34px;
      min-width: 62px;
      padding: 0 14px;
      border-radius: 10px;
    }
    .sort-hint { margin-bottom: 9px; font-size: 11px; }
    .node-sort-handle {
      left: 8px;
      width: 36px;
      height: 44px;
      border-radius: 11px;
    }
    .node-sort-handle span { width: 16px; }
  }

  .edit-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.38); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 2100; }
  .edit-modal-overlay.open { display: flex; }
  .edit-modal { width: min(420px, 100%); background: var(--card-bg); border-radius: 16px; box-shadow: 0 18px 55px rgba(0,0,0,0.22); padding: 20px; }
  .edit-modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .edit-modal-field { margin-bottom: 12px; }
  .edit-modal-field label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .edit-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .edit-modal-actions button { height: 40px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .edit-cancel-btn { background: #e5e5ea; color: var(--text-main); }
  .edit-save-btn { background: var(--ios-blue); color: #fff; }
  #toast {
    position: fixed; top: calc(env(safe-area-inset-top) + 20px); left: 50%;
    transform: translateX(-50%) translateY(-60px); background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff;
    padding: 10px 24px; border-radius: 25px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<body>

<div class="main-wrapper" id="main-content">
  <!-- 点击顶部主标题可触发移动端控制台抽屉的展开/收起 -->
  <button class="desktop-control-btn" type="button" onclick="toggleDrawer(true)">控制面板</button>
  <div class="ios-large-header" onclick="toggleDrawer()" title="点击打开控制面板">
    <div class="large-title">PingMonitor</div>
    <div class="header-sub-row">
      <span class="status-dot" id="header-dot"></span>
      <span class="last-update-text" id="last-update">最后更新: --:--:--</span>
    </div>
  </div>

  <div class="group-title">系统状态概览</div>
  <div class="widget-grid">
    <div class="widget-card"><div class="widget-lbl">总监控节点</div><div class="widget-val" id="stat-total">0</div></div>
    <div class="widget-card"><div class="widget-lbl">在线节点</div><div class="widget-val" style="color: var(--ios-green);" id="stat-online">0</div></div>
    <div class="widget-card"><div class="widget-lbl">异常节点</div><div class="widget-val" style="color: var(--ios-red);" id="stat-offline">0</div></div>
    <div class="widget-card"><div class="widget-lbl">平均延迟</div><div class="widget-val" style="color: var(--ios-blue);" id="stat-delay">-- ms</div></div>
  </div>

  <div class="dashboard-grid">
    <div class="main-section">
      <div class="node-list-header">
        <div class="group-title" style="margin-bottom:12px;">监控节点列表</div>
        <button class="node-sort-btn" id="sort-toggle-btn" type="button" onclick="toggleSortMode()">排序</button>

<script>
const USE_MOCK = false;
let lastRenderedHTML = "", lastLogsText = "";
const $ = id => document.getElementById(id);

function formatUptime(s) {
    if (s < 0) s = 0;
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (d > 0 ? d + "天 " : "") + [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
}

function showToast(msg) {
    const t = $("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}

function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(`已复制: ${text}`)).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast(`已复制: ${text}`); } catch { showToast("复制失败"); }
    document.body.removeChild(ta);
}

async function fetchJSON(url) {
    try { const res = await fetch(url); return res.ok ? await res.json() : null; } catch { return null; }
}


const ipLocationCache = {};

const countryZh = {

function toZhLocation(value, map) {
    if (!value) return "";
    return map[value] || value;
}

function countryToZh(data) {
    if (data.country_code && countryZh[data.country_code.toUpperCase()]) return countryZh[data.country_code.toUpperCase()];
    if (data.country && countryZh[data.country]) return countryZh[data.country];
    try {
        if (data.country_code && typeof Intl !== "undefined" && Intl.DisplayNames) {
            const dn = new Intl.DisplayNames(["zh-CN"], { type: "region" });
            return dn.of(data.country_code.toUpperCase()) || data.country || "";
        }
    } catch(e) {}
    return data.country || "";
}

async function getIPLocation(ip){
    if(ipLocationCache[ip]) return ipLocationCache[ip];

    try{
        const res = await fetch("https://api.ip.sb/geoip/" + encodeURIComponent(ip));
        const data = await res.json();

        if(data){
            const parts = [];
            const country = countryToZh(data);
            if(country) parts.push(country);
            const region = toZhLocation(data.region, regionZh);
            const city = toZhLocation(data.city, cityZh);
            if(region && region !== country && region !== city) parts.push(region);
            if(city && city !== country && city !== region) parts.push(city);
            const isp = data.isp || data.organization || data.asn_organization;
            let loc = parts.join(" ");
            if(isp) loc += (loc ? " · " : "") + isp;
            ipLocationCache[ip] = loc || "未知";
            return ipLocationCache[ip];
        }
    }catch(e){}

    ipLocationCache[ip] = "未知";
    return "未知";
}

function refreshIPLocations(nodes){
    nodes.forEach(n=>{
        getIPLocation(n.ip).then(loc=>{
            const el=document.getElementById("location-"+n.ip);
            if(el) el.innerText=loc;
        });
    });
}

async function refreshDashboard(isInitial = false) {
    const [config, status, sysData, logsData] = await Promise.all([
        fetchJSON("/api/config"), fetchJSON("/api/status"), fetchJSON("/api/system"), fetchJSON("/api/logs")
    ]);

    if (sysData) {
        const badge = $("service-status-badge"), uptimeEl = $("service-uptime"), dot = $("header-dot");
        if (sysData.running) {
            badge.className = "badge-online"; badge.innerText = "运行中";
            uptimeEl.style.color = "var(--text-main)"; uptimeEl.innerText = formatUptime(sysData.uptime);
            if (dot) dot.style.backgroundColor = "var(--ios-green)";
        } else {
            badge.className = "badge-offline"; badge.innerText = "已停止";
            uptimeEl.innerText = "已停止"; uptimeEl.style.color = "var(--text-muted)";
            if (dot) dot.style.backgroundColor = "var(--ios-red)";
        }
    }

    if (config) {
        const wIn = $("worker"), iIn = $("interval");
        if (isInitial || document.activeElement !== wIn) wIn.value = config.worker || "";
        if (isInitial || document.activeElement !== iIn) iIn.value = config.interval || 60;
        
        const isRunning = sysData && sysData.running;
        const statusMap = {};
        (status || []).forEach(n => statusMap[n.ip] = n);

        let totalOnline = 0, totalOffline = 0, totalDelay = 0, delayCount = 0;
        const nodes = config.nodes || [];
         refreshIPLocations(nodes);
        
        const htmlParts = nodes.map(n => {
            const item = !isRunning ? { name: n.name, ip: n.ip, status: "等待检测", delay: "-", last: "-", fail: 0 }
                       : (statusMap[n.ip] ? { ...statusMap[n.ip] } : { name: n.name, ip: n.ip, status: "检测中", delay: "-", last: "-", fail: 0 });

            if (item.status === "在线") totalOnline++;
            if (item.status === "离线") totalOffline++;
            const numDelay = parseInt(item.delay);
            if (!isNaN(numDelay)) { totalDelay += numDelay; delayCount++; }

            const badgeCls = item.status === "在线" ? "badge-online" : (item.status === "离线" ? "badge-offline" : "badge-checking");
            const delayCls = !isNaN(numDelay) ? (numDelay < 150 ? 'delay-good' : (numDelay < 400 ? 'delay-medium' : 'delay-bad')) : "";
            const failCount = parseInt(item.fail) || 0;

            return `
            <div class="node-card" data-ip="${escapeHtml(item.ip)}">
              <button class="node-sort-handle" type="button" aria-label="拖动排序" title="拖动排序">
                <span></span><span></span><span></span>
              </button>
              <div class="node-top-row">
                <div class="node-identity">
                  <span class="node-name" title="${escapeHtml(item.name || '未命名')}">${escapeHtml(item.name || '未命名')}</span>
                  <span class="node-ip" onclick="copyText('${escapeHtml(item.ip)}')">${escapeHtml(item.ip)}</span>
                   <span class="node-location" id="location-${escapeHtml(item.ip)}">查询归属地...</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                  <span class="${badgeCls}">${escapeHtml(item.status)}</span>
                  <span class="delay-text ${delayCls}">${escapeHtml(String(item.delay))}</span>
                </div>
              </div>
              <div class="node-bottom-row">
                <div class="node-stats-group">
                  <span>最后检测: <strong class="stat-val">${escapeHtml(String(item.last))}</strong></span>
                  ${failCount > 0 ? `<span style="color:var(--ios-red);">连续失败: <strong style="color:var(--ios-red);">${failCount} 次</strong></span>` : ''}
                </div>
                <div class="node-action-group">
                  <button class="ios-btn ios-btn-secondary" style="height:30px; padding:0 14px; font-size:12px; font-weight:600; width:auto;" onclick="openEditModal('${escapeHtml(item.ip)}')">编辑</button>
                  <button class="del-btn" onclick="delNode('${escapeHtml(item.ip)}')">删除</button>
                </div>
              </div>
            </div>`;
        });

        $("stat-total").innerText = nodes.length;
        $("stat-online").innerText = totalOnline;
        $("stat-offline").innerText = totalOffline;
        $("stat-delay").innerText = delayCount > 0 ? Math.round(totalDelay / delayCount) + " ms" : "-- ms";
        $("last-update").innerText = "最后更新: " + new Date().toLocaleTimeString('zh-CN', { hour12: false });

        const container = $("nodes-container");
        if (nodes.length === 0) {
            container.innerHTML = '<div class="ios-card" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px;"><span class="empty-pc">暂无监控节点，请在右侧添加</span><span class="empty-mobile">暂无监控节点，点击标题打开控制台添加</span></div>';
            lastRenderedHTML = "";
        } else if (!sortMode) {
            const finalHTML = '<div class="node-cards-grid">' + htmlParts.join('') + '</div>';
            if (finalHTML !== lastRenderedHTML) {
                container.innerHTML = finalHTML;
                lastRenderedHTML = finalHTML;
            }
        } else {
            const grid = container.querySelector(".node-cards-grid");
            if (grid) {
                grid.classList.add("sorting");
                bindSortEvents(grid);
            }
        }
    }

    if (logsData) {
        const box = $("logs");
        const logsStr = (logsData || []).join("\n");
        if (logsStr !== lastLogsText) {
            lastLogsText = logsStr;
            if (!logsData || logsData.length === 0) {
                box.innerHTML = "暂无日志或日志已被清空。";
            } else {
                box.innerHTML = logsData.map(line => escapeHtml(line)).join("<br>");
                box.scrollTop = box.scrollHeight;
            }
        }
    }
}

async function apiPost(url, data, successMsg) {
    try {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && (json.ok !== false)) {
            if (successMsg) showToast(successMsg);
            await refreshDashboard();
            return json;
        } else {
            showToast(json.error || "操作失败");
            return null;
        }
    } catch {
        showToast("网络请求失败");
        return null;
    }
}

async function addNode(){
    const name = $("name").value.trim(), ip = $("ip").value.trim();
    if (!ip) { showToast("请输入有效的 IP 地址或域名"); return; }
    
    // 添加节点
    const result = await apiPost("/api/add", { name, ip }, "节点添加成功");
    if (result) {
        $("name").value = ""; $("ip").value = "";
        
        // 检查服务是否正在运行，如果是，则立即触发一次检查/刷新以让新节点开始检测
        try {
            const sysRes = await fetch("/api/system");
            const sysData = await sysRes.json().catch(() => ({}));
            if (sysData && sysData.running) {
                // 如果后端有触发检测的接口可在此调用，或者直接强行刷新面板
                await refreshDashboard();
            }
        } catch(e) {}
    }
}

async function delNode(ip){
    if (confirm(`确定要删除节点 [${ip}] 吗？`)) {
        await apiPost("/api/delete", { ip }, "节点已删除");
    }
}

async function saveWorker(){
    await apiPost("/api/worker", { worker: $("worker").value.trim() }, "Telegram Worker 已保存");
}

async function saveInterval(){
    const interval = $("interval").value;
    if (!interval || interval < 5) { showToast("间隔时间不能小于 5 秒"); return; }
    await apiPost("/api/interval", { interval }, "检测间隔已更新");
}

async function service(a){
    const actionMap = { start: '启动', stop: '停止', restart: '重启' };
    try {
        const res = await fetch("/api/service/" + a);
        const json = await res.json();
        if (json.ok) {
            showToast(`服务${actionMap[a] || a}指令已发送`);
            setTimeout(refreshDashboard, 500);
        } else {
            showToast(`指令发送失败: ${json.error || '未知错误'}`);
        }
    } catch {
        showToast("指令发送失败");
    }
}

async function clearLogs(){
    if (!confirm("确定要清空系统终端日志吗？")) return;
    try {
        const res = await fetch("/api/logs/clear", { method: "POST" });
        const json = await res.json();
        if (json.ok) {
            lastLogsText = "";
            await refreshDashboard();
            showToast("系统终端日志已清空");
        } else {
            showToast(`清空日志失败: ${json.error || '未知错误'}`);
        }
    } catch {
        showToast("清空日志失败");
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}


let sortMode = false;
let editingOriginalIP = "";
let sortDragCard = null;
let sortPointerId = null;
let sortStartY = 0;
let sortMoved = false;

function toggleSortMode() {
    sortMode = !sortMode;
    const btn = $("sort-toggle-btn");
    const hint = $("sort-hint");
    btn.classList.toggle("active", sortMode);
    btn.innerText = sortMode ? "完成" : "排序";
    if (hint) hint.classList.toggle("show", sortMode);

    const grid = document.querySelector(".node-cards-grid");
    if (grid) {
        grid.classList.toggle("sorting", sortMode);
        bindSortEvents(grid);
    }

    if (sortMode) {
        showToast("已进入排序模式");
    } else {
        clearSortDrag();
        showToast("排序模式已结束");
        refreshDashboard();
    }
}

function clearSortDrag() {
    if (sortDragCard) sortDragCard.classList.remove("dragging");
    sortDragCard = null;
    sortPointerId = null;
    sortMoved = false;
}

function bindSortEvents(grid) {
    if (grid.dataset.sortBound === "1") return;
    grid.dataset.sortBound = "1";

    let autoScrollTimer = null;

    const stopAutoScroll = () => {
        if (autoScrollTimer) {
            cancelAnimationFrame(autoScrollTimer);
            autoScrollTimer = null;
        }
    };

    const autoScroll = (clientY) => {
        const edge = 70;
        const speed = 9;
        let delta = 0;
        if (clientY < edge) delta = -speed;
        else if (clientY > window.innerHeight - edge) delta = speed;
        if (!delta) {
            stopAutoScroll();
            return;
        }
        if (autoScrollTimer) return;
        const tick = () => {
            if (!sortDragCard) {
                stopAutoScroll();
                return;
            }
            window.scrollBy(0, delta);
            autoScrollTimer = requestAnimationFrame(tick);
        };
        autoScrollTimer = requestAnimationFrame(tick);
    };

    grid.addEventListener("pointerdown", e => {
        if (!sortMode) return;
        const handle = e.target.closest(".node-sort-handle");
        if (!handle) return;

        const card = handle.closest(".node-card");
        if (!card) return;

        e.preventDefault();
        sortDragCard = card;
        sortPointerId = e.pointerId;
        sortStartY = e.clientY;
        sortMoved = false;
        handle.classList.add("grabbing");

        if (navigator.vibrate) {
            try { navigator.vibrate(12); } catch(err) {}
        }
        try { handle.setPointerCapture(e.pointerId); } catch(err) {}
    });

    grid.addEventListener("pointermove", e => {
        if (!sortMode || !sortDragCard || e.pointerId !== sortPointerId) return;

        const distance = Math.abs(e.clientY - sortStartY);
        if (!sortMoved && distance < 5) return;

        if (!sortMoved) {
            sortMoved = true;
            sortDragCard.classList.add("dragging");
        }

        e.preventDefault();
        autoScroll(e.clientY);

        const el = document.elementFromPoint(e.clientX, e.clientY);
        const target = el && el.closest ? el.closest(".node-card") : null;
        if (!target || target === sortDragCard || target.parentNode !== grid) return;

        const rect = target.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        if (before) {
            grid.insertBefore(sortDragCard, target);
        } else if (target.nextSibling !== sortDragCard) {
            grid.insertBefore(sortDragCard, target.nextSibling);
        }
    });

    const finish = async e => {
        if (!sortDragCard || e.pointerId !== sortPointerId) return;

        stopAutoScroll();
        const didMove = sortMoved;
        const gridRef = grid;
        const handle = sortDragCard.querySelector(".node-sort-handle");
        if (handle) handle.classList.remove("grabbing");

        clearSortDrag();

        if (didMove) {
            if (navigator.vibrate) {
                try { navigator.vibrate(18); } catch(err) {}
            }
            await saveCurrentOrder(gridRef);
        }
    };

    grid.addEventListener("pointerup", finish);
    grid.addEventListener("pointercancel", finish);
}

async function saveCurrentOrder(grid) {
    if (!sortMode || !grid) return;
    const nodes = Array.from(grid.querySelectorAll(".node-card")).map(card => ({ ip: card.dataset.ip }));
    if (!nodes.length) return;
    const result = await apiPost("/api/reorder", { nodes }, "排序已保存");
    if (!result) {
        showToast("排序保存失败");
        await refreshDashboard();
    }
}

async function openEditModal(ip) {
    const config = await fetchJSON("/api/config");
    const node = config && (config.nodes || []).find(n => n.ip === ip);
    if (!node) {
        showToast("未找到该节点");
        return;
    }
    editingOriginalIP = ip;
    $("edit-name").value = node.name || "";
    $("edit-ip").value = node.ip || "";
    $("edit-modal-overlay").classList.add("open");
    setTimeout(() => $("edit-name").focus(), 50);
}

function closeEditModal() {
    editingOriginalIP = "";
    $("edit-modal-overlay").classList.remove("open");
}

async function saveEditNode() {
    const name = $("edit-name").value.trim();
    const ip = $("edit-ip").value.trim();

    if (!ip) {
        showToast("请输入有效的 IP 地址或域名");
        return;
    }
    if (!editingOriginalIP) {
        closeEditModal();
        return;
    }

    const result = await apiPost("/api/edit", {
        old_ip: editingOriginalIP,
        name,
        ip
    }, "节点信息已更新");

    if (result) {
        delete ipLocationCache[editingOriginalIP];
        delete ipLocationCache[ip];
        closeEditModal();
    }
}

const drawer = $("drawer"), overlay = $("drawer-overlay"), headerArea = $("drawer-header-area"), drawerContent = $("drawer-content");
let isExpanded = false, startY = 0, currentY = 0, isDragging = false, isPullFromContent = false, maxTranslate = 0, rafId = null;

function isMobile() { return window.innerWidth < 992; }

function toggleDrawer(expand, fromPopState = false) {
    if (!isMobile()) {
        isExpanded = expand !== undefined ? expand : !isExpanded;
        drawer.classList.toggle("open", isExpanded);
        drawer.classList.toggle("closed", !isExpanded);
        overlay.classList.toggle("open", isExpanded);
        document.body.classList.toggle("drawer-open", isExpanded);
        return;
    }
    isExpanded = expand !== undefined ? expand : !isExpanded;
    drawer.style.transform = ""; overlay.style.opacity = ""; drawer.classList.remove("dragging");
    
    if (isExpanded) {
        drawer.classList.add("open"); drawer.classList.remove("closed"); overlay.classList.add("open");
        document.body.classList.add("drawer-open");
        if (!fromPopState) {
            try { history.pushState({ drawerOpen: true }, ""); } catch(e) {}
        }
    } else {
        drawer.classList.add("closed"); drawer.classList.remove("open"); overlay.classList.remove("open");
        document.body.classList.remove("drawer-open");
        if (!fromPopState && history.state && history.state.drawerOpen) {
            try { history.back(); } catch(e) {}
        }
    }
}

window.addEventListener("popstate", (e) => {
    if (isMobile() && isExpanded) {
        toggleDrawer(false, true);
    }
});

function onTouchStart(e, fromContent = false) {
    if (!isMobile()) return;
    if (fromContent && (drawerContent.scrollTop > 0 || !isExpanded)) return;
    startY = e.touches[0].clientY; currentY = startY; isDragging = true; isPullFromContent = fromContent;
    maxTranslate = drawer.offsetHeight - 64; drawer.classList.add("dragging");
}

function onTouchMove(e) {
    if (!isDragging || !isMobile()) return;
    currentY = e.touches[0].clientY;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
        const deltaY = currentY - startY;
        let currentTranslate = 0;
        if (isPullFromContent) {
            if (deltaY > 0 && drawerContent.scrollTop <= 0) {
                if (e.cancelable) e.preventDefault();
                currentTranslate = deltaY;
            } else { isDragging = false; return; }
        } else {
            if (e.cancelable) e.preventDefault();
            currentTranslate = !isExpanded ? Math.max(0, maxTranslate + deltaY) : Math.max(0, deltaY);
        }
        drawer.style.transform = `translate3d(0, ${currentTranslate}px, 0)`;
        const progress = Math.max(0, Math.min(1, 1 - (currentTranslate / maxTranslate)));
        overlay.style.opacity = progress;
        if (progress > 0) overlay.classList.add("open");
    });
}

function onTouchEnd() {
    if (!isDragging || !isMobile()) return;
    isDragging = false;
    if (rafId) cancelAnimationFrame(rafId);
    const deltaY = currentY - startY;
    toggleDrawer(!isExpanded ? deltaY < -40 : deltaY <= 50);
    startY = 0; currentY = 0; isPullFromContent = false;
}

headerArea.addEventListener("touchstart", e => onTouchStart(e, false), { passive: true });
headerArea.addEventListener("touchmove", onTouchMove, { passive: false });
headerArea.addEventListener("touchend", onTouchEnd);

drawerContent.addEventListener("touchstart", e => onTouchStart(e, true), { passive: true });
drawerContent.addEventListener("touchmove", onTouchMove, { passive: false });
drawerContent.addEventListener("touchend", onTouchEnd);

window.addEventListener('resize', () => {
    drawer.style.transform = ""; overlay.style.opacity = ""; drawer.classList.remove("dragging");
    if (!isMobile()) {
        drawer.classList.toggle("open", isExpanded);
        drawer.classList.toggle("closed", !isExpanded);
        overlay.classList.toggle("open", isExpanded);
        document.body.classList.toggle("drawer-open", isExpanded);
    } else {
        drawer.classList.toggle("open", isExpanded); drawer.classList.toggle("closed", !isExpanded); overlay.classList.toggle("open", isExpanded);
        if (isExpanded) document.body.classList.add("drawer-open");
    }
});

refreshDashboard(true);
let pollTimer = setInterval(refreshDashboard, 5000);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearInterval(pollTimer); pollTimer = null; }
    else { refreshDashboard(); if (!pollTimer) pollTimer = setInterval(refreshDashboard, 5000); }
});
</script>
</body>
