<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>
PingMonitor
</title>


<style>

body{

    font-family:Arial;
    background:#f5f5f5;
    padding:30px;

}


.box{

    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;

}


button{

    padding:8px 15px;
    margin:5px;
    cursor:pointer;

}


input{

    padding:8px;
    margin:5px;

}


.online{

    color:green;

}


.offline{

    color:red;

}


</style>


</head>



<body>


<h1>
PingMonitor
</h1>



<div class="box">


<h3>
监控节点
</h3>


<table border="1" cellpadding="10">


<tr>

<th>
名称
</th>

<th>
IP
</th>

<th>
状态
</th>

<th>
操作
</th>

</tr>


{% for n in nodes %}


<tr>


<td>
{{n.name}}
</td>


<td>
{{n.ip}}
</td>


<td>

{% if n.status=="在线" %}

<span class="online">
{{n.status}}
</span>

{% else %}

<span class="offline">
{{n.status}}
</span>

{% endif %}


</td>



<td>

<a href="/delete/{{loop.index0}}">

<button>
删除
</button>

</a>


</td>


</tr>


{% endfor %}


</table>


</div>





<div class="box">


<h3>
添加节点
</h3>


<form action="/add" method="post">


名称:

<input name="name">


IP:

<input name="ip">


<button>
添加
</button>


</form>


</div>






<div class="box">


<h3>
Telegram Worker
</h3>



<form action="/worker" method="post">


<input

style="width:400px"

name="worker"

value="{{worker}}"

placeholder="Worker地址">


<button>
保存
</button>


</form>


</div>






<div class="box">


<h3>
服务控制
</h3>


<a href="/service/start">

<button>
开始监控
</button>

</a>



<a href="/service/stop">

<button>
停止监控
</button>

</a>



<a href="/service/restart">

<button>
重启监控
</button>

</a>


</div>



</body>

</html>
